<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои игроки</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; margin: 20px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f9f9f9; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        button, .btn { padding: 8px 16px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; text-decoration: none; color: black; font-size: 14px; }
        button:hover, .btn:hover { background: #e0e0e0; }
        .error { color: #a00; margin-bottom: 15px; font-weight: bold; }
        .add-form { display: flex; gap: 10px; align-items: flex-start; }
        .add-form input { width: 200px; padding: 8px; border: 1px solid #ccc; }
        .add-form select { padding: 8px; border: 1px solid #ccc; }
        .status-pending { color: #b8860b; }
        .status-found { color: #2a7a2a; }
        .status-not_found { color: #a00; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Мои игроки</h1>

    <div class="toolbar">
        <a href="/" class="btn">← На главную</a>
    </div>

    <div id="errorBox" class="error" style="display: none;"></div>

    <table id="tbl">
        <thead>
            <tr>
                <th>Ник</th>
                <th>Регион</th>
                <th>K</th>
                <th>D</th>
                <th>K/D</th>
                <th>Часы</th>
                <th>Был онлайн</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="8" style="text-align: center;">Загрузка...</td></tr>
        </tbody>
    </table>

    <h3>Добавить</h3>
    <form id="addForm" class="add-form">
        <input name="nickname" placeholder="Ник" required autocomplete="off">
        <select name="region">
            <option value="RU">RU</option>
            <option value="EU">EU</option>
            <option value="NA">NA</option>
        </select>
        <button type="submit">добавить</button>
    </form>
</div>

<div id="historyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div style="background: white; padding: 20px; width: 800px; max-width: 90%; border-radius: 8px;">
        <h3 id="historyTitle">История K/D</h3>
        <div style="position: relative; height: 400px; width: 100%;">
            <canvas id="historyChart"></canvas>
        </div>
        <button onclick="document.getElementById('historyModal').style.display='none'" style="margin-top: 15px; width: 100%; padding: 10px;">Закрыть</button>
    </div>
</div>

<script>
    const errorBox = document.getElementById('errorBox');
    const tbody = document.querySelector('#tbl tbody');
    const addForm = document.getElementById('addForm');
    let myChart = null;

    function showError(msg) {
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }

    function clearError() {
        errorBox.style.display = 'none';
    }

    async function showHistory(nickname, region) {
        try {
            const r = await fetch(`/api/player/history?nickname=${encodeURIComponent(nickname)}&region=${region}`);
            const data = await r.json();
            
            if (!data.history || data.history.length === 0) {
                alert('Истории пока нет. Воркер должен сделать хотя бы 2 проверки, чтобы построить график.');
                return;
            }

            const history = data.history.slice().reverse();
            const labels = history.map(h => h.recorded_at);
            const kdData = history.map(h => h.kd);
            const killsData = history.map(h => h.kills);

            document.getElementById('historyTitle').innerText = `История: ${nickname} (${region})`;
            document.getElementById('historyModal').style.display = 'flex';

            const ctx = document.getElementById('historyChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'K/D',
                            data: kdData,
                            borderColor: '#2a7a2a',
                            backgroundColor: 'rgba(42, 122, 42, 0.1)',
                            yAxisID: 'y',
                            tension: 0.3
                        },
                        {
                            label: 'Убийства',
                            data: killsData,
                            borderColor: '#a00',
                            yAxisID: 'y1',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'K/D' } },
                        y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: 'Убийства' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        } catch(e) {
            showError('Ошибка загрузки истории: ' + e.message);
        }
    }

    async function refresh() {
        clearError();
        try {
            const r = await fetch('/api/my_players');
            if (!r.ok) {
                const err = await r.json();
                showError('Ошибка сервера: ' + (err.error || r.status));
                return;
            }
            const data = await r.json();
            const players = data.players || [];

            tbody.innerHTML = '';

            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Список пуст. Добавьте игрока ниже.</td></tr>';
                return;
            }

            for (const p of players) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.nickname}</td>
                    <td>${p.region}</td>
                    <td class="c-k">...</td>
                    <td class="c-d">...</td>
                    <td class="c-kd">...</td>
                    <td class="c-h">...</td>
                    <td class="c-last">...</td>
                    <td>
                        <button class="history-btn" data-n="${p.nickname}" data-r="${p.region}" style="margin-right: 5px;">График</button>
                        <button class="del-btn" data-n="${p.nickname}" data-r="${p.region}" style="background: #ffcccc;">удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);

                tr.querySelector('.del-btn').onclick = async (e) => {
                    e.target.disabled = true;
                    await fetch('/api/my_players', {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({nickname: p.nickname, region: p.region})
                    });
                    refresh();
                };

                tr.querySelector('.history-btn').onclick = () => {
                    showHistory(p.nickname, p.region);
                };

                loadStats(p.nickname, p.region, tr);
            }
        } catch (e) {
            showError('Ошибка сети: ' + e.message);
        }
    }

    async function loadStats(nickname, region, tr) {
        try {
            const r = await fetch(`/api/player?nickname=${encodeURIComponent(nickname)}&region=${encodeURIComponent(region)}`);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();

            tr.querySelector('.c-k').innerText = data.kills ?? 0;
            tr.querySelector('.c-d').innerText = data.deaths ?? 0;
            tr.querySelector('.c-kd').innerText = (data.kd !== null && data.kd !== undefined) ? Number(data.kd).toFixed(2) : '0.00';
            tr.querySelector('.c-h').innerText = data.hours_played ?? 0;
            tr.querySelector('.c-last').innerText = data.last_online || 'не найден';
        } catch (e) {
            tr.querySelector('.c-last').innerText = 'ошибка';
        }
    }

    addForm.onsubmit = async (e) => {
        e.preventDefault();
        clearError();
        const btn = addForm.querySelector('button[type="submit"]');
        btn.disabled = true;

        const f = new FormData(addForm);
        const nickname = f.get('nickname').trim();
        const region = f.get('region');

        try {
            const r = await fetch('/api/my_players', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nickname, region})
            });
            if (!r.ok) {
                const err = await r.json();
                showError('Не удалось добавить: ' + (err.error || r.status));
                return;
            }
            addForm.reset();
            await refresh();
        } catch (err) {
            showError('Ошибка сети: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    };

    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
